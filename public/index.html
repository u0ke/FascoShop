<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASCO - Fashion Store</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>

<body class="bg-white text-[#454545]">

    <!-- Header -->
    <header class="mx-auto flex max-w-[960px] items-center justify-between px-6 py-8">

        <a href="#" class="font-serif text-[28px] font-bold tracking-tight">
            FASCO
        </a>

        <nav class="hidden items-center gap-9 text-[12px] font-normal md:flex">
            <a href="#" class="hover:text-gray-500">Home</a>
            <a href="#" class="hover:text-gray-500">Deals</a>
            <a href="#" class="hover:text-gray-500">New Arrivals</a>
            <a href="#" class="hover:text-gray-500">Packages</a>
            <a href="#" class="hover:text-gray-500">Sign in</a>

            <a href="#" class="rounded-md bg-black px-8 py-3 text-white shadow-lg transition hover:bg-gray-800">
                Sign Up
            </a>
        </nav>

        <button class="text-2xl md:hidden" aria-label="Open menu">
            ☰
        </button>

    </header>


    <!-- Hero Section -->
    <main class="mx-auto max-w-[960px] px-6">

        <section class="grid grid-cols-1 gap-5 sm:grid-cols-3">

            <!-- Left Image -->
            <div class="h-[570px] overflow-hidden rounded-lg bg-[#e0e0e0]">
                <img
                    src="/assets/home/59866250d2fc5a879ffcc793dc57565cb166bdcd.png"
                    alt="Men's fashion collection"
                    class="h-full w-full object-cover"
                >
            </div>


            <!-- Center Content -->
            <div class="flex flex-col gap-6">

                <!-- Top Image -->
                <div class="h-[115px] overflow-hidden rounded-lg bg-[#e0e0e0]">
                    <img
                        src="/assets/home/63152539556c7ef09daff7f0e836524aaf0d723f.png"
                        alt="Women's fashion collection"
                        class="h-full w-full object-cover"
                    >
                </div>

                <!-- Sale Text -->
                <div class="flex flex-1 flex-col items-center justify-center text-center">

                    <h1 class="text-[40px] font-semibold leading-tight tracking-tight">
                        ULTIMATE
                    </h1>

                    <p class="text-[88px] font-normal leading-none tracking-tight text-transparent [-webkit-text-stroke:1px_#777]">
                        SALE
                    </p>

                    <p class="mt-3 text-[13px] font-medium tracking-[2px]">
                        NEW COLLECTION
                    </p>

                    <a href="#"
                        class="mt-5 rounded-md bg-black px-11 py-3 text-[11px] text-white shadow-lg transition hover:bg-gray-800">
                        SHOP NOW
                    </a>

                </div>

                <!-- Bottom Image -->
                <div class="h-[115px] overflow-hidden rounded-lg">
                    <img
                        src="/assets/home/c6ed7b8b05275d0c4f047ca38e286565bc785434.jpg"
                        alt="Women's new collection"
                        class="h-full w-full object-cover"
                    >
                </div>

            </div>


            <!-- Right Image -->
            <div class="h-[570px] overflow-hidden rounded-lg bg-[#e0e0e0]">
                <img
                    src="/assets/home/f5c95fe473850a225b7cfa1222bf5117db038cb6.png"
                    alt="Men's fashion collection"
                    class="h-full w-full object-cover"
                >
            </div>

        </section>


        <!-- Brand Strip -->
        <section class="mt-16 flex flex-wrap items-center justify-between gap-8 pb-10 text-black">

            <span class="text-[21px] font-bold tracking-[2px]">
                CHANEL
            </span>

            <span class="text-[12px] font-semibold tracking-[1px]">
                LOUIS VUITTON
            </span>

            <span class="font-serif text-[27px] font-black tracking-wider">
                PRADA
            </span>

            <span class="text-[20px] font-medium tracking-tight">
                Calvin Klein
            </span>

            <span class="text-[21px] font-black tracking-[-1px]">
                DENIM
            </span>

        </section>

    </main>


    <!-- Floating Buttons -->
    <div class="fixed bottom-8 right-6 flex items-center gap-5">

        <button aria-label="Shopping cart"
            class="flex h-11 w-11 items-center justify-center rounded-lg bg-black text-white shadow-xl">

            <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19"
                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 8H6"/>
                <circle cx="10" cy="21" r="1"/>
                <circle cx="19" cy="21" r="1"/>
            </svg>

        </button>

        <button aria-label="Back to top"
            onclick="window.scrollTo({top: 0, behavior: 'smooth'})"
            class="flex h-11 w-11 items-center justify-center rounded-full border border-gray-400 bg-white text-xl text-black">

            ↑

        </button>

    </div>

</body>
</html>
